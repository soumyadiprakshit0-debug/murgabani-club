<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Member Login | MURGABANI 1 TO 100 CLUB</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">

</head>

<body>

<header class="login-header">

<a href="index.html" class="login-back-home">
    ❮ Back to Home
</a>
  
<h1>Member Login</h1>

<p>
Access the Club Management & Information System
</p>

</header>

<section class="login-section">

<div class="login-card">

<h2>Login</h2>

<form>

<input
    type="text"
    id="username"
    placeholder="Member ID"
    required>

<div class="password-box">

    <input
        type="password"
        id="password"
        placeholder="Password"
        required>

    <span id="togglePassword">👁️</span>

</div>

<button type="submit">
Login
</button>

</form>

<p class="forgot">
<a href="#">Forgot Password?</a>
</p>

</div>

</section>
<script src="js/login.js"></script>

<!-- Login Modal -->
<div id="loginModal" class="modal">

    <div class="modal-content">

        <div id="loginModalIcon" class="modal-icon">❌</div>

        <h2 id="loginModalTitle">Login Failed</h2>

        <p id="loginModalMessage"></p>

        <button onclick="closeLoginModal()">OK</button>

    </div>

</div>

<!-- Loading Spinner -->
<div id="loadingOverlay" class="loading-overlay">

    <div class="spinner"></div>

    <p>Signing you in...</p>

</div>
  
</body>
</html>
